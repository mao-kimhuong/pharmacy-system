      - traefik.http.routers.sales-public.priority=100
      - traefik.http.routers.sales-public.entrypoints=web
      - traefik.http.routers.sales-public.service=sales
      - traefik.http.routers.sales-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # public: ABA PayWay's callback (unsigned: it only makes the service ask PayWay), limited per IP
      - traefik.http.routers.sales-payway-callback.rule=Path(`/api/sales/v1/payments/payway/callback`)
      - traefik.http.routers.sales-payway-callback.priority=100
      - traefik.http.routers.sales-payway-callback.entrypoints=web
      - traefik.http.routers.sales-payway-callback.service=sales
      - traefik.http.routers.sales-payway-callback.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-per-ip@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.sales.rule=PathPrefix(`/api/sales`)
      - traefik.http.routers.sales.priority=10
      - traefik.http.routers.sales.entrypoints=web
      - traefik.http.routers.sales.service=sales
      - traefik.http.routers.sales.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

