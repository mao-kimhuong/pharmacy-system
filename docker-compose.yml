      - traefik.http.routers.stockcount.entrypoints=web
      - traefik.http.routers.stockcount.service=stockcount
      - traefik.http.routers.stockcount.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
