name: pharmacy

x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  APP_ENV: ${APP_ENV:-}  # development: make seed-realistic's dev clock (pharmacy_shared.clock)
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # URLs are built in pharmacy_shared.config, so passwords may contain any character
  DB_HOST: postgres
  DB_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_TOKEN: ${SERVICE_TOKEN}

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_started

services:
  traefik:
    image: traefik:v3.6  # v3.6.1+ needed for Docker Engine 29 (API auto-negotiation)
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks: [edge, internal]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      BRANCH_DB_PASSWORD: ${BRANCH_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      STOCKCOUNT_DB_PASSWORD: ${STOCKCOUNT_DB_PASSWORD}
      PRESCRIPTION_DB_PASSWORD: ${PRESCRIPTION_DB_PASSWORD}
      CONTROLLED_DB_PASSWORD: ${CONTROLLED_DB_PASSWORD}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD}
      CUSTOMERS_DB_PASSWORD: ${CUSTOMERS_DB_PASSWORD}
      PURCHASING_DB_PASSWORD: ${PURCHASING_DB_PASSWORD}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [internal]
    restart: unless-stopped

  # File store (S3 API) for Rx photos and PDFs. Internal network only: no host
  # port, no Traefik route. Files reach browsers only through the prescription
  # service, which checks the user and writes the audit entry on every download.
  # The admin key comes from S3_ACCESS_KEY / S3_SECRET_KEY in .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: auth
      API_PREFIX: /api/auth/v1
      DB_NAME: pharmacy_auth
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    depends_on: *service-deps
    labels:
      - traefik.enable=true
      - traefik.http.services.auth.loadbalancer.server.port=8000
      # public: health check and API docs (docs are switched off in production)
      - traefik.http.routers.auth-public.rule=Path(`/api/auth/v1/health`) || Path(`/api/auth/v1/docs`) || Path(`/api/auth/v1/openapi.json`)
      - traefik.http.routers.auth-public.priority=100
      - traefik.http.routers.auth-public.entrypoints=web
      - traefik.http.routers.auth-public.service=auth
      - traefik.http.routers.auth-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # public: login (strict limit) and refresh
      - traefik.http.routers.auth-login.rule=Path(`/api/auth/v1/login`) || Path(`/api/auth/v1/login/2fa`)
      - traefik.http.routers.auth-login.priority=100
      - traefik.http.routers.auth-login.entrypoints=web
      - traefik.http.routers.auth-login.service=auth
      - traefik.http.routers.auth-login.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-login@file
      - traefik.http.routers.auth-refresh.rule=Path(`/api/auth/v1/refresh`)
      - traefik.http.routers.auth-refresh.priority=100
      - traefik.http.routers.auth-refresh.entrypoints=web
      - traefik.http.routers.auth-refresh.service=auth
      - traefik.http.routers.auth-refresh.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-per-ip@file
      # protected, with the login limit: password + 2FA code checks on the profile
      - traefik.http.routers.auth-mfa.rule=PathPrefix(`/api/auth/v1/me/2fa`) || Path(`/api/auth/v1/2fa/backup-codes`)
      - traefik.http.routers.auth-mfa.priority=100
      - traefik.http.routers.auth-mfa.entrypoints=web
      - traefik.http.routers.auth-mfa.service=auth
      - traefik.http.routers.auth-mfa.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-login@file,auth-forward@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)
      - traefik.http.routers.auth.priority=10
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.service=auth
      - traefik.http.routers.auth.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

  branch:
    build:
      context: .
      dockerfile: services/branch/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: branch
      API_PREFIX: /api/branch/v1
