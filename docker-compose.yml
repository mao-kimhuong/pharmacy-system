      # public: health check and API docs (docs are switched off in production)
      - traefik.http.routers.reports-public.rule=Path(`/api/reports/v1/health`) || Path(`/api/reports/v1/docs`) || Path(`/api/reports/v1/openapi.json`)
      - traefik.http.routers.reports-public.priority=100
      - traefik.http.routers.reports-public.entrypoints=web
      - traefik.http.routers.reports-public.service=reports
      - traefik.http.routers.reports-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.reports.rule=PathPrefix(`/api/reports`)
      - traefik.http.routers.reports.priority=10
      - traefik.http.routers.reports.entrypoints=web
      - traefik.http.routers.reports.service=reports
      - traefik.http.routers.reports.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: notification
      API_PREFIX: /api/notifications/v1
      DB_NAME: pharmacy_notification
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      TELEGRAM_LINK_SECRET: ${TELEGRAM_LINK_SECRET:-}
      WEB_URL: ${WEB_URL:-http://localhost}
    depends_on: *service-deps
    labels:
      - traefik.enable=true
      - traefik.http.services.notification.loadbalancer.server.port=8000
      # public: health check and API docs (docs are switched off in production)
      - traefik.http.routers.notification-public.rule=Path(`/api/notifications/v1/health`) || Path(`/api/notifications/v1/docs`) || Path(`/api/notifications/v1/openapi.json`)
      - traefik.http.routers.notification-public.priority=100
      - traefik.http.routers.notification-public.entrypoints=web
      - traefik.http.routers.notification-public.service=notification
      - traefik.http.routers.notification-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # public: Telegram's webhook (Telegram cannot log in; the service checks the secret token header)
      - traefik.http.routers.notification-telegram.rule=Path(`/api/notifications/v1/telegram/webhook`)
      - traefik.http.routers.notification-telegram.priority=100
      - traefik.http.routers.notification-telegram.entrypoints=web
      - traefik.http.routers.notification-telegram.service=notification
      - traefik.http.routers.notification-telegram.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-per-ip@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.notification.rule=PathPrefix(`/api/notifications`)
      - traefik.http.routers.notification.priority=10
      - traefik.http.routers.notification.entrypoints=web
      - traefik.http.routers.notification.service=notification
      - traefik.http.routers.notification.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

  document:
