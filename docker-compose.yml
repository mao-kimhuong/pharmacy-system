      - traefik.http.routers.purchasing.entrypoints=web
      - traefik.http.routers.purchasing.service=purchasing
      - traefik.http.routers.purchasing.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
