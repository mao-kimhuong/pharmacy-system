      - traefik.enable=true
      - traefik.http.services.document.loadbalancer.server.port=8000
      # public: health check and API docs (docs are switched off in production)
      - traefik.http.routers.document-public.rule=Path(`/api/documents/v1/health`) || Path(`/api/documents/v1/docs`) || Path(`/api/documents/v1/openapi.json`)
      - traefik.http.routers.document-public.priority=100
      - traefik.http.routers.document-public.entrypoints=web
      - traefik.http.routers.document-public.service=document
      - traefik.http.routers.document-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.document.rule=PathPrefix(`/api/documents`)
      - traefik.http.routers.document.priority=10
      - traefik.http.routers.document.entrypoints=web
      - traefik.http.routers.document.service=document
      - traefik.http.routers.document.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: ai
      API_PREFIX: /api/ai/v1
      DB_NAME: pharmacy_ai
      DB_USER: ai_user
      DB_PASSWORD: ${AI_DB_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL_FAST: ${DEEPSEEK_MODEL_FAST}
      DEEPSEEK_MODEL_REASONING: ${DEEPSEEK_MODEL_REASONING}
    depends_on: *service-deps
    labels:
      - traefik.enable=true
      - traefik.http.services.ai.loadbalancer.server.port=8000
      # public: health check and API docs (docs are switched off in production)
      - traefik.http.routers.ai-public.rule=Path(`/api/ai/v1/health`) || Path(`/api/ai/v1/docs`) || Path(`/api/ai/v1/openapi.json`)
      - traefik.http.routers.ai-public.priority=100
      - traefik.http.routers.ai-public.entrypoints=web
      - traefik.http.routers.ai-public.service=ai
      - traefik.http.routers.ai-public.middlewares=strip-identity-headers@file,security-headers-docs@file,ratelimit-per-ip@file
      # protected: everything else needs a valid access token
      - traefik.http.routers.ai.rule=PathPrefix(`/api/ai`)
      - traefik.http.routers.ai.priority=10
      - traefik.http.routers.ai.entrypoints=web
      - traefik.http.routers.ai.service=ai
      - traefik.http.routers.ai.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
    networks: [internal]
    restart: unless-stopped

  # Web front end (static files). Lowest priority: every /api router (10-100) wins.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_APP_ENV: ${APP_ENV:-}
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.service=web
      - traefik.http.routers.web.middlewares=strip-identity-headers@file,ratelimit-static@file
    networks: [internal]
    restart: unless-stopped

secrets:
  payway_rsa_public:
    file: ${PAYWAY_RSA_PUBLIC_KEY_SOURCE:-./infra/payway/not-set.pem}
  payway_rsa_private:
    file: ${PAYWAY_RSA_PRIVATE_KEY_SOURCE:-./infra/payway/not-set.pem}

networks:
  edge:
  internal:
    internal: false  # set to true in production; only traefik needs the edge network

volumes:
  pgdata:
  letsencrypt:
  seaweedfs:
