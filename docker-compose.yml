  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: sales
      API_PREFIX: /api/sales/v1
      DB_NAME: pharmacy_sales
      DB_USER: sales_user
      DB_PASSWORD: ${SALES_DB_PASSWORD}
      KHQR_PROVIDER: ${KHQR_PROVIDER:-fake}
      KHQR_ACCOUNT_ID: ${KHQR_ACCOUNT_ID:-}
      KHQR_MERCHANT_NAME: ${KHQR_MERCHANT_NAME:-}
      KHQR_CITY: ${KHQR_CITY:-Phnom Penh}
      KHQR_MERCHANT_ID: ${KHQR_MERCHANT_ID:-}
      KHQR_ACQUIRING_BANK: ${KHQR_ACQUIRING_BANK:-}
      BAKONG_TOKEN: ${BAKONG_TOKEN:-}
      # ABA PayWay (KHQR_PROVIDER=payway). The key files are compose secrets (read-only at /run/secrets/);
      # PAYWAY_RSA_*_KEY_SOURCE in .env names them on the host (default: a placeholder, so `up` works without).
      PAYWAY_BASE_URL: ${PAYWAY_BASE_URL:-}
      PAYWAY_MERCHANT_ID: ${PAYWAY_MERCHANT_ID:-}
      PAYWAY_API_KEY: ${PAYWAY_API_KEY:-}
      PAYWAY_CALLBACK_URL: ${PAYWAY_CALLBACK_URL:-}
      PAYWAY_WEB_URL: ${PAYWAY_WEB_URL:-http://localhost}  # PayWay checkout sends the window back here
      PAYWAY_RSA_PUBLIC_KEY_FILE: /run/secrets/payway_rsa_public.pem
      PAYWAY_RSA_PRIVATE_KEY_FILE: /run/secrets/payway_rsa_private.pem  # mounted, never read (no API needs it)
    secrets:
      - source: payway_rsa_public
        target: payway_rsa_public.pem
      - source: payway_rsa_private
        target: payway_rsa_private.pem
    depends_on: *service-deps
    labels:
      - traefik.enable=true
      - traefik.http.services.sales.loadbalancer.server.port=8000
      # public: health check and API docs (docs are switched off in production)
