      - traefik.http.routers.branch.priority=10
      - traefik.http.routers.branch.entrypoints=web
      - traefik.http.routers.branch.service=branch
      - traefik.http.routers.branch.middlewares=strip-identity-headers@file,security-headers@file,request-size-limit@file,ratelimit-flood@file,auth-forward@file
