[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pharmacy-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["auth_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
