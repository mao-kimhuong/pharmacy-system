# PostgreSQL and Redis for tests only (make test starts them). Data lives in
# memory and is thrown away. Ports differ from the main stack on purpose.
name: pharmacy-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # `make test-docker`: runs scripts/test-all.sh in a container against the
  # two services above. Not started by `make test-db` (profile "runner").
  tests:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: infra/test/Dockerfile
    environment:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@postgres-test:5432/postgres
      TEST_REDIS_URL: redis://redis-test:6379/15
    volumes:
      - .:/repo
      - test-venv:/venv
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

volumes:
  test-venv:
