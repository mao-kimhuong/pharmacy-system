[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-shared"
version = "0.2.0"
description = "Code shared by every pharmacy service: config, db, errors, auth headers, outbox, logging, middlewares"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aio-pika>=9.4",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1", "defusedxml>=0.7"]  # pharmacy_shared.xlsx

[tool.setuptools.packages.find]
include = ["pharmacy_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
